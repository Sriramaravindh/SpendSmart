name = "spendsmart-gemini-proxy"
main = "src/index.js"
compatibility_date = "2024-09-01"

# The Gemini API key is NOT stored here. It is a Worker secret set with:
#   npx wrangler secret put GEMINI_API_KEY
# Never commit the key to this file or the repo.

# Optional: bind a KV namespace for a HARD, globally-accurate daily cap.
# Create it with `npx wrangler kv namespace create RATE_KV`, paste the id
# below, then uncomment the env.RATE_KV block in src/index.js.
# [[kv_namespaces]]
# binding = "RATE_KV"
# id = "<your-kv-namespace-id>"
